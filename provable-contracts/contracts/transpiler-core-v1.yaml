metadata:
  version: 1.0.0
  verification_level: L5
  description: 'Core transpiler invariants (GH-183). Every Rust→Shell transpilation must satisfy: determinism, POSIX structure,
    variable safety, and selective stdlib emission. These are falsifiable — a single counterexample breaks the contract.'
  verification_command: cargo test -p bashrs --lib -- transpil
  references:
  - 'GH-183: KZ-11 Missing provable contracts'
  - 'GH-148: rash transpiler stdlib'
  depends_on:
  - parser-soundness-v1
  - transpiler-stdlib-v1
  - encoder-roundtrip-v1
kernel_structure:
  phases:
  - name: Rust parsing
    description: Parse Rust source into syn AST
    invariant: Valid Rust input always produces a parseable AST
  - name: IR lowering
    description: Lower syn AST to intermediate representation (BashAst)
    invariant: All supported Rust constructs map to IR nodes
  - name: Purification
    description: Apply determinism and idempotency transforms to IR
    invariant: Non-deterministic patterns ($RANDOM, $$, timestamps) are eliminated
  - name: POSIX emission
    description: Emit POSIX sh with shebang, set -euf, main() wrapper, and selective stdlib emission
    invariant: Output is byte-identical for identical input (deterministic)
equations:
  transpilation:
    formula: transpile(rust_ast) -> shell_script where shellcheck(shell_script) == PASS
    domain: 'rust_ast: Rust AST (parsed from .rs file)'
    codomain: String (POSIX sh script)
    invariants:
    - Output passes shellcheck -s sh
    - Same input produces identical output (deterministic)
proof_obligations:
- type: invariant
  property: Output passes shellcheck -s sh
  formal: Output passes shellcheck -s sh
  tolerance: 0.0
  applies_to: all
- type: invariant
  property: Same input produces identical output (deterministic)
  formal: Same input produces identical output (deterministic)
  tolerance: 0.0
  applies_to: all
invariants:
- 'Transpilation is deterministic: same Rust input → byte-identical shell output'
- 'Output is POSIX-structured: #!/bin/sh, set -euf, main() wrapper'
- All variables are double-quoted to prevent word splitting
- Only used stdlib functions are emitted (dead code elimination)
falsification_tests:
- id: F-CORE-001
  rule: Transpiling identical input twice produces byte-identical...
  prediction: transpile(input) == transpile(input) for all valid inputs
  test: 'Given input, verify: transpile(input) == transpile(input) for all valid inputs'
  if_fails: 'Contract violation: Transpiling identical input twice produces byte-identical...'
- id: F-CORE-002
  rule: Determinism holds for complex programs with stdlib calls
  prediction: transpile(input) == transpile(input) — stdlib does not introduce non-determinism
  test: 'Given input, verify: transpile(input) == transpile(input) — stdlib does not introduce non-determinism'
  if_fails: 'Contract violation: Determinism holds for complex programs with stdlib calls'
- id: F-CORE-003
  rule: 'Every transpiled script starts with #!/bin/sh shebang'
  prediction: output.starts_with('#!/bin/sh') for all inputs
  test: output.starts_with('#!/bin/sh') for all inputs
  if_fails: 'Contract violation: Every transpiled script starts with #!/bin/sh shebang'
- id: F-CORE-004
  rule: Every transpiled script contains 'set -euf' safety flags
  prediction: output.contains('set -euf') for all inputs
  test: output.contains('set -euf') for all inputs
  if_fails: 'Contract violation: Every transpiled script contains ''set -euf'' safety flags'
- id: F-CORE-005
  rule: Every transpiled script wraps code in main() function
  prediction: output.contains('main()') AND output.contains('main "$@"')
  test: output.contains('main()') AND output.contains('main "$@"')
  if_fails: 'Contract violation: Every transpiled script wraps code in main() function'
- id: F-CORE-006
  rule: Variable references are always double-quoted (prevents wo...
  prediction: variable expansion uses "$name" not bare $name
  test: 'Given input, verify: variable expansion uses "$name" not bare $name'
  if_fails: 'Contract violation: Variable references are always double-quoted (prevents wo...'
- id: F-CORE-007
  rule: Unused stdlib functions are NOT emitted (dead code elimin...
  prediction: output does NOT contain rash_string_ or rash_fs_ functions
  test: 'Given input, verify: output does NOT contain rash_string_ or rash_fs_ functions'
  if_fails: 'Contract violation: Unused stdlib functions are NOT emitted (dead code elimin...'
- id: F-CORE-008
  rule: Used stdlib functions ARE emitted as shell function defin...
  prediction: output contains 'rash_string_contains()' function definition
  test: 'Given input, verify: output contains ''rash_string_contains()'' function definition'
  if_fails: 'Contract violation: Used stdlib functions ARE emitted as shell function defin...'
- id: F-CORE-009
  rule: mkdir() always uses -p flag for idempotency
  prediction: output contains 'mkdir' AND '-p'
  test: 'Given input, verify: output contains ''mkdir'' AND ''-p'''
  if_fails: 'Contract violation: mkdir() always uses -p flag for idempotency'
- id: F-CORE-010
  rule: capture() with pipes preserves pipeline semantics
  prediction: output preserves '|' operator (not escaped as literal)
  test: 'Given input, verify: output preserves ''|'' operator (not escaped as literal)'
  if_fails: 'Contract violation: capture() with pipes preserves pipeline semantics'
- id: F-CORE-011
  rule: capture() without pipes uses direct $(cmd) form
  prediction: output contains $(whoami), no sh -c wrapper
  test: 'Given input, verify: output contains $(whoami), no sh -c wrapper'
  if_fails: 'Contract violation: capture() without pipes uses direct $(cmd) form'
- id: F-CORE-012
  rule: 'GH-294: a string literal that the emitter quotes single-quoted is not
    refused for holding an inert backtick, $( ) or $VAR — those bytes never
    expand inside single quotes in any POSIX shell'
  prediction: 'let s = "a `b` c"; println!("{}", s) transpiles successfully and
    the emitted script prints ''a `b` c'' verbatim under dash and sh'
  test: 'Given input, verify: transpile succeeds and the script''s stdout under
    dash equals the literal bytes'
  if_fails: 'Contract violation: transpilation refuses a literal whose emitted
    (single-quoted) form is inert, over-applying the SC2006/command-substitution
    check pre-emission instead of at the quoted-output stage (GH-294)'
- id: F-CORE-013
  rule: 'GH-294: exec()/capture() string arguments hold live shell text, so a
    backtick or $( ) there stays refused — this is the true-positive case that
    the GH-294 fix must not weaken'
  prediction: 'exec("echo `date`") and exec("echo $(date)") both still fail
    transpile validation'
  test: 'Given input, verify: transpile returns Err for both exec() strings'
  if_fails: 'Contract violation: GH-294 fix over-corrected and stopped blocking
    live command substitution inside exec()/capture() arguments'
- id: F-TCORE-020
  rule: a method call with no lowering fails the transpile naming the method, and is never emitted as the shell no-op colon
  prediction: 'transpiling an unlowerable method call returns an error whose message names the method'
  test: cargo test -p bashrs --lib ir::pmat257_gh305_gh306_tests::test_PMAT257_gh305_unlowerable_method_call_is_an_error
  if_fails: 'Contract violation: an unlowerable call is emitted as a no-op again and the program silently does nothing, as in GH-305'
- id: F-TCORE-021
  rule: len on a local array literal lowers to the real element count, never to the placeholder string
  prediction: 'the transpiled output of a len call on a literal array carries the count'
  test: cargo test -p bashrs --lib ir::pmat257_gh305_gh306_tests::test_PMAT257_gh306_len_on_local_array_literal_is_the_count
  if_fails: 'Contract violation: array length falls back to the placeholder again, as in GH-306'
- id: F-TCORE-022
  rule: len on a string lowers to the POSIX length expansion, and a variable known to be an array never takes that path
  prediction: 'the transpiled output of a len call on a string carries the length expansion, and an array takes the count path instead'
  test: cargo test -p bashrs --lib ir::pmat258_gh316_tests::test_PMAT258_gh316_len_uses_shell_length_expansion_not_a_command
  if_fails: 'Contract violation: len falls back to a placeholder again, or reports the joined texts length as an element count, as in GH-306'
- id: F-TCORE-023
  rule: unwrap_or lowers to the unset-only default, so a variable that is set and empty keeps its value
  prediction: 'a variable set to the empty string keeps the empty value rather than taking the default'
  test: cargo test -p bashrs --lib ir::pmat258_gh316_tests::test_PMAT258_unwrap_or_on_set_but_empty_variable_keeps_empty_value
  if_fails: 'Contract violation: the lowering moved to the empty-or-unset spelling, so a present empty value is silently replaced, contradicting the quorum decision of 2026-09-11'
- id: F-TCORE-024
  rule: a method with no honest POSIX spelling still fails the transpile naming the method
  prediction: 'push_str, push, insert and rev each return an error naming the method rather than a value'
  test: cargo test -p bashrs --lib ir::pmat258_gh316_tests::test_PMAT258_gh316_push_str_has_no_lowering_is_an_error
  if_fails: 'Contract violation: an unlowerable method produces a value again instead of failing, the silent-wrong-output class of GH-305'
- id: F-TCORE-025
  rule: a bare std::env::var("X") is the same environment read as env("X") and lowers to the parameter expansion, never to a command named std::env::var
  prediction: 'the transpiled output is byte-identical to that of env("X"), carries "${X}", and contains no command substitution of std::env::var; under dash an unset X aborts (set -u) rather than running a missing command'
  test: cargo test -p bashrs --lib ir::pmat265_env_var_tests::test_PMAT265_bare_env_var_is_a_parameter_expansion_not_a_command
  if_fails: 'Contract violation: an environment read is emitted as a command that does not exist, so the script runs, prints an error to stderr and continues with an empty value'
- id: F-TCORE-026
  rule: std::env::var("X").unwrap_or(d) and unwrap_or_else(|_| d) lower to the unset-only default on X itself, so a set-but-empty X keeps its value and an unset X takes the default
  prediction: 'under dash, unset X prints the default and X= prints the empty string, for both spellings and for a default written as "d".to_string()'
  test: cargo test -p bashrs --lib ir::pmat265_env_var_tests::test_PMAT265_env_var_unwrap_or_is_unset_only_default_on_the_env_name
  if_fails: 'Contract violation: the commonest Rust spelling of an env default fails the transpile or lowers through an intermediate variable that is always set, so the default can never apply'
- id: F-TCORE-027
  rule: std::env::var("X").unwrap_or_default() lowers to "${X-}" (the script runs under set -u); unwrap() to "${X?}", which aborts when X is unset; expect(msg) to "${X?msg}"
  prediction: 'unwrap_or_default prints empty for unset X; unwrap exits non-zero under dash when X is unset and prints the value when set; expect names its message on stderr'
  test: cargo test -p bashrs --lib ir::pmat265_env_var_tests::test_PMAT265_env_var_unwrap_expect_and_unwrap_or_default_have_exact_spellings
  if_fails: 'Contract violation: a panicking read is lowered to a silent empty string, or a defaulting read to an abort'
- id: F-TCORE-028
  rule: the default of unwrap_or is spelled for the double-quoted ${x-...} context, so a brace, a space, a dollar, a quote or a backslash in the default prints literally under bash, dash and busybox
  prediction: 'for the defaults {brace}, "a b", $HOME, it''s and a\b the transpiled script prints each default byte-for-byte under dash and bash when the variable is unset'
  test: cargo test -p bashrs --lib ir::pmat265_env_var_tests::test_PMAT265_unwrap_or_default_text_survives_braces_spaces_dollars_and_quotes
  if_fails: 'Contract violation: the 7.3.0 rendering through escape_shell_string returns, printing literal single quotes under bash and a syntax error under dash for any default that is not a plain word'
- id: F-TCORE-029
  rule: an environment name that is not a shell identifier is refused with an error naming it, never spliced into an expansion
  prediction: 'std::env::var("my-var").unwrap_or("d") fails the transpile and the error names my-var'
  test: cargo test -p bashrs --lib ir::pmat265_env_var_tests::test_PMAT265_env_var_non_identifier_name_is_refused
  if_fails: 'Contract violation: an invalid name is emitted inside ${...} and the shell reports a bad substitution at run time instead of the transpiler at build time'
- id: F-TCORE-030
  rule: arithmetic expansion inside a capture() or exec string is not command substitution; a real $(cmd), including one nested inside $((...)), and a backtick are still refused
  prediction: 'capture("echo $((1 + 2))") transpiles and prints 3 under dash; capture("echo $(date)"), capture("echo $(( $(date) ))") and a backtick each fail the transpile'
  test: cargo test -p bashrs --lib ir::pmat265_env_var_tests::test_PMAT265_arithmetic_in_capture_string_is_not_command_substitution
  if_fails: 'Contract violation: either arithmetic is refused again (the GH-237 class, in the transpiler) or a nested command substitution slips through the exec-string validator'
kani_harnesses:
- id: KANI-TRANSPILER_CORE-001
  obligation: Output passes shellcheck -s sh
  property: Output passes shellcheck -s sh
  bound: 4
  strategy: stub_float
  harness: verify_transpiler_core_shellcheck
- id: KANI-TRANSPILER_CORE-002
  obligation: Same input produces identical output (deterministic)
  property: Same input produces identical output (deterministic)
  bound: 4
  strategy: stub_float
  harness: verify_transpiler_core_determinism
- id: KANI-TRANSPILER_CORE-003
  obligation: Output is POSIX-structured with shebang, set -euf, and main() wrapper
  property: 'Output is POSIX-structured: #!/bin/sh, set -euf, main() wrapper'
  bound: 4
  strategy: stub_float
  harness: verify_transpiler_core_posix_structure
- id: KANI-TRANSPILER_CORE-004
  obligation: All variables are double-quoted to prevent word splitting
  property: All variables are double-quoted to prevent word splitting
  bound: 4
  strategy: stub_float
  harness: verify_transpiler_core_variable_quoting
