metadata:
  version: 1.0.0
  verification_level: L5
  description: Provable determinism and idempotency linter contracts (GH-183). DET rules detect non-deterministic constructs
    ($RANDOM, timestamps, unordered globs, system state). DET005 (#232) is split from DET002 - it detects time-dependent
    control flow (a wall-clock value reaching a branch condition) rather than reproducibility (a wall-clock value reaching
    a build artifact); the two never fire on the same line, and a duration (elapsed = end - start) fires neither. IDEM
    rules detect non-idempotent operations (mkdir without -p, rm without -f, ln without -sf). Each rule must detect
    known-bad and not false-positive on known-safe.
  verification_command: cargo test -p bashrs --lib -- det
  depends_on:
  - parser-soundness-v1
  references:
  - 'GH-183: KZ-11 Missing provable contracts'
  - 'CLAUDE.md: Critical Invariants — Determinism + Idempotency'
kernel_structure:
  phases:
  - name: scan_nondet
    description: Scan shell source for non-deterministic constructs ($RANDOM, date, unordered globs, system state)
    invariant: DET001-DET004 detect all non-deterministic patterns
  - name: scan_nonidem
    description: Scan shell source for non-idempotent operations (mkdir, rm, ln without safety flags)
    invariant: IDEM001-IDEM003 detect all non-idempotent operations
  - name: emit_diagnostics
    description: Emit LintDiagnostic with DET/IDEM rule ID, severity, span, and auto-fix suggestion
    invariant: Each diagnostic includes an actionable fix
equations:
  determinism_detection:
    formula: 'forall s in NonDeterministic: exists rule in DET: fires(rule, s)'
    domain: 's: script containing $RANDOM, timestamps, unordered globs, or system state'
    codomain: Vec<LintDiagnostic> with DET rule IDs
    invariants:
    - DET rules detect all non-deterministic constructs
    - DET rules do NOT false-positive on deterministic code
proof_obligations:
- type: invariant
  property: DET rules detect all non-deterministic constructs
  formal: DET rules detect all non-deterministic constructs
  tolerance: 0.0
  applies_to: all
- type: invariant
  property: DET rules do NOT false-positive on deterministic code
  formal: DET rules do NOT false-positive on deterministic code
  tolerance: 0.05
  applies_to: all
invariants:
- DET rules detect all non-deterministic constructs ($RANDOM, timestamps, system state)
- DET rules do NOT false-positive on deterministic code
- IDEM rules detect non-idempotent operations (mkdir without -p, rm without -f)
- IDEM rules do NOT false-positive on idempotent operations
falsification_tests:
- id: F-DET001-SOUND
  rule: DET001 detects $RANDOM usage
  prediction: lint result contains DET001
  test: 'Given input, verify: lint result contains DET001'
  if_fails: 'Contract violation: DET001 detects $RANDOM usage'
- id: F-DET001-PRECISE
  rule: DET001 does NOT flag literal integer assignment
  prediction: lint result does NOT contain DET001
  test: 'Given input, verify: lint result does NOT contain DET001'
  if_fails: 'Contract violation: DET001 does NOT flag literal integer assignment'
- id: F-DET002-SOUND
  rule: DET002 detects date in command substitution
  prediction: lint result contains DET002 for date command substitution
  test: 'Given input, verify: lint result contains DET002 for date command substitution'
  if_fails: 'Contract violation: DET002 detects date in command substitution'
- id: F-DET002-PRECISE
  rule: DET002 does NOT flag static string assignment
  prediction: lint result does NOT contain DET002
  test: 'Given input, verify: lint result does NOT contain DET002'
  if_fails: 'Contract violation: DET002 does NOT flag static string assignment'
- id: F-DET002-SINK
  rule: DET002 detects a timestamp that reaches a build artifact path
  prediction: lint result contains DET002 for cp a "b_$(date +%s)"
  test: 'Given input, verify: lint result contains DET002 for an artifact path'
  if_fails: 'Contract violation: DET002 detects a timestamp reaching a build artifact path'
- id: F-DET002-LOG
  rule: DET002 does NOT flag a timestamp on an append-only log sink
  prediction: lint result does NOT contain DET002
  test: 'Given input, verify: lint result does NOT contain DET002'
  if_fails: 'Contract violation: DET002 does NOT flag a timestamp on an append-only log'
- id: F-DET002-SDE
  rule: DET002 does NOT flag a timestamp derived from SOURCE_DATE_EPOCH
  prediction: lint result does NOT contain DET002
  test: 'Given input, verify: lint result does NOT contain DET002'
  if_fails: 'Contract violation: DET002 must not fire on its own remedy (GH-230)'
- id: F-DET002-GH263-BARE-DATE-SINKa
  rule: DET002 detects a bare `date` command word - not only `date` inside
    `$( )`/backticks - when its value is redirected into a file with `>`
    (GH-263)
  prediction: lint result contains DET002 for `date > VERSION` and `date -u
    +%Y > VERSION`
  test: cargo test -p bashrs --lib linter::rules::det002::tests_gh263::test_PMAT251_gh263_bare_date_redirected_to_file_is_detected
  if_fails: 'Contract violation: DET002 misses a bare `date` command word
    redirected into a file with `>` (GH-263)'
- id: F-DET002-GH263-BARE-DATE-SINKb
  rule: DET002 detects a bare `date` command word - not only `date` inside
    `$( )`/backticks - when its value is appended with `>>` or piped into
    `tee` (GH-263)
  prediction: lint result contains DET002 for `date >> VERSION` and `date |
    tee VERSION`
  test: cargo test -p bashrs --lib linter::rules::det002::tests_gh263::test_PMAT251_gh263_bare_date_appended_or_teed_is_detected
  if_fails: 'Contract violation: DET002 misses a bare `date` command word
    appended or piped into `tee` (GH-263)'
- id: F-DET002-GH263-DATE-TO-TERMINAL-NOT-REPORTED
  rule: DET002 does NOT flag a bare `date` with no redirect or pipe - printing
    to the terminal is `#232`/DET005 territory (time-dependent control flow),
    not a reproducible-output defect
  prediction: lint result does NOT contain DET002 for a bare `date` with no
    sink
  test: test_PMAT251_gh263_date_to_terminal_is_not_reported
  if_fails: 'Contract violation: DET002 flags a bare `date` that has no
    possible reproducible sink'
- id: F-DET002-GH232-DURATION-NOT-FLAGGED
  rule: DET002 does NOT flag a duration - the arithmetic difference of two
    timestamp captures assigned to a variable that is only printed. Measuring
    elapsed time is the point of measuring elapsed time (#232)
  prediction: lint result does NOT contain DET002 for `start=$(date +%s);
    end=$(date +%s); elapsed=$(( end - start )); echo "$elapsed"`
  test: test_PMAT255_gh232_d5_duration_neither_rule
  if_fails: 'Contract violation: DET002 flags a duration computed from two
    timestamp captures (#232)'
- id: F-DET005-SOUNDa
  rule: DET005 detects a wall-clock value reaching an `if` branch condition
    rather than a build artifact - time-dependent control flow, split out of
    DET002 (#232)
  prediction: lint result contains DET005 for `if [ "$(date +%H)" -lt 6 ];
    then ... fi`
  test: cargo test -p bashrs --lib linter::rules::det005::det005_tests::test_PMAT255_gh232_d1_if_hour_check_is_det005_warning_not_det002
  if_fails: 'Contract violation: DET005 misses a wall-clock value reaching an
    `if` branch condition (#232)'
- id: F-DET005-SOUNDb
  rule: DET005 detects a wall-clock value reaching a `while` branch condition
    rather than a build artifact - time-dependent control flow, split out of
    DET002 (#232)
  prediction: lint result contains DET005 for `while [ "$(date +%s)" -lt
    "$deadline" ]; do ... done`
  test: cargo test -p bashrs --lib linter::rules::det005::det005_tests::test_PMAT255_gh232_d2_while_deadline_is_det005_warning_not_det002
  if_fails: 'Contract violation: DET005 misses a wall-clock value reaching a
    `while` branch condition (#232)'
- id: F-DET005-SOUNDc
  rule: DET005 detects a wall-clock value reaching a `case` selector rather
    than a build artifact - time-dependent control flow, split out of DET002
    (#232)
  prediction: lint result contains DET005 for `case "$(date +%u)" in 6|7)
    ... esac`
  test: cargo test -p bashrs --lib linter::rules::det005::det005_tests::test_PMAT255_gh232_d3_case_weekday_is_det005_warning_not_det002
  if_fails: 'Contract violation: DET005 misses a wall-clock value reaching a
    `case` selector (#232)'
- id: F-DET005-SOUNDd
  rule: DET005 detects a wall-clock value reaching a `[ ]`/`[[ ]]` test used
    as a branch condition rather than a build artifact - time-dependent
    control flow, split out of DET002 (#232)
  prediction: lint result contains DET005 for `[ "$(date +%s)" -gt "$expiry"
    ] && exit 1`
  test: cargo test -p bashrs --lib linter::rules::det005::det005_tests::test_PMAT255_gh232_d4_expiry_guard_is_det005_warning_not_det002
  if_fails: 'Contract violation: DET005 misses a wall-clock value reaching a
    `[ ]`/`[[ ]]` test guard (#232)'
- id: F-DET005-WARNING-SEVERITYa
  rule: DET005 reports at Warning, not Error, for the `if` hour-check example
    - unlike a timestamp in an artifact name this is often deliberate
    (cron-style scripts, backoff loops), and an unactionable Error gets the
    rule disabled rather than the code fixed (#232)
  prediction: the DET005 diagnostic for `if [ "$(date +%H)" -lt 6 ]; then
    ... fi` has severity warning
  test: cargo test -p bashrs --lib linter::rules::det005::det005_tests::test_PMAT255_gh232_d1_if_hour_check_is_det005_warning_not_det002
  if_fails: 'Contract violation: DET005 fires at a severity other than
    warning for the `if` example (#232)'
- id: F-DET005-WARNING-SEVERITYb
  rule: DET005 reports at Warning, not Error, for the `while` deadline-loop
    example (#232)
  prediction: the DET005 diagnostic for `while [ "$(date +%s)" -lt
    "$deadline" ]; do ... done` has severity warning
  test: cargo test -p bashrs --lib linter::rules::det005::det005_tests::test_PMAT255_gh232_d2_while_deadline_is_det005_warning_not_det002
  if_fails: 'Contract violation: DET005 fires at a severity other than
    warning for the `while` example (#232)'
- id: F-DET005-WARNING-SEVERITYc
  rule: DET005 reports at Warning, not Error, for the `case` weekday example
    (#232)
  prediction: the DET005 diagnostic for `case "$(date +%u)" in 6|7) ... esac`
    has severity warning
  test: cargo test -p bashrs --lib linter::rules::det005::det005_tests::test_PMAT255_gh232_d3_case_weekday_is_det005_warning_not_det002
  if_fails: 'Contract violation: DET005 fires at a severity other than
    warning for the `case` example (#232)'
- id: F-DET005-WARNING-SEVERITYd
  rule: DET005 reports at Warning, not Error, for the expiry-guard example
    (#232)
  prediction: the DET005 diagnostic for `[ "$(date +%s)" -gt "$expiry" ] &&
    exit 1` has severity warning
  test: cargo test -p bashrs --lib linter::rules::det005::det005_tests::test_PMAT255_gh232_d4_expiry_guard_is_det005_warning_not_det002
  if_fails: 'Contract violation: DET005 fires at a severity other than
    warning for the expiry-guard example (#232)'
- id: F-DET005-NO-DOUBLE-REPORTa
  rule: DET005 and DET002 never both fire on the same line - for the `if`
    hour-check example, a value that reaches a branch condition and nothing
    else is Conditional (DET005 only) (#232)
  prediction: for `if [ "$(date +%H)" -lt 6 ]; then ... fi`, lint result does
    NOT also contain DET002
  test: cargo test -p bashrs --lib linter::rules::det005::det005_tests::test_PMAT255_gh232_d1_if_hour_check_is_det005_warning_not_det002
  if_fails: 'Contract violation: DET002 double-reports the `if` example
    alongside DET005 (#232)'
- id: F-DET005-NO-DOUBLE-REPORTb
  rule: DET005 and DET002 never both fire on the same line - for the `while`
    deadline-loop example, a value that reaches a branch condition and
    nothing else is Conditional (DET005 only) (#232)
  prediction: for `while [ "$(date +%s)" -lt "$deadline" ]; do ... done`,
    lint result does NOT also contain DET002
  test: cargo test -p bashrs --lib linter::rules::det005::det005_tests::test_PMAT255_gh232_d2_while_deadline_is_det005_warning_not_det002
  if_fails: 'Contract violation: DET002 double-reports the `while` example
    alongside DET005 (#232)'
- id: F-DET005-NO-DOUBLE-REPORTc
  rule: DET005 and DET002 never both fire on the same line - for the `case`
    weekday example, a value that reaches a branch condition and nothing
    else is Conditional (DET005 only) (#232)
  prediction: for `case "$(date +%u)" in 6|7) ... esac`, lint result does NOT
    also contain DET002
  test: cargo test -p bashrs --lib linter::rules::det005::det005_tests::test_PMAT255_gh232_d3_case_weekday_is_det005_warning_not_det002
  if_fails: 'Contract violation: DET002 double-reports the `case` example
    alongside DET005 (#232)'
- id: F-DET005-NO-DOUBLE-REPORTd
  rule: DET005 and DET002 never both fire on the same line - for the
    expiry-guard example, a value that reaches a branch condition and
    nothing else is Conditional (DET005 only) (#232)
  prediction: for `[ "$(date +%s)" -gt "$expiry" ] && exit 1`, lint result
    does NOT also contain DET002
  test: cargo test -p bashrs --lib linter::rules::det005::det005_tests::test_PMAT255_gh232_d4_expiry_guard_is_det005_warning_not_det002
  if_fails: 'Contract violation: DET002 double-reports the expiry-guard
    example alongside DET005 (#232)'
- id: F-DET005-NO-DOUBLE-REPORTe
  rule: DET005 and DET002 never both fire on the same line - a value that
    reaches an artifact is Reproducible (DET002 only), not also Conditional
    (#232)
  prediction: for the DET002 artifact example (`echo "$(date)" > VERSION`),
    lint result does NOT also contain DET005
  test: cargo test -p bashrs --lib linter::rules::det005::det005_tests::test_PMAT255_gh232_d6_det002_still_fires_on_artifact_write
  if_fails: 'Contract violation: DET005 double-reports the DET002 artifact
    example (#232)'
- id: F-DET005-PRECISE-DURATION
  rule: DET005 does NOT flag a duration - the same arithmetic-difference
    exemption that applies to DET002 applies here too, since a duration never
    reaches a branch condition (#232)
  prediction: lint result does NOT contain DET005 for `start=$(date +%s);
    end=$(date +%s); elapsed=$(( end - start )); echo "$elapsed"`
  test: test_PMAT255_gh232_d5_duration_neither_rule
  if_fails: 'Contract violation: DET005 flags a duration computed from two
    timestamp captures (#232)'
- id: F-DET002-GH265-SHELLCHECK-NAMESPACE-REJECTEDa
  rule: A bashrs-native code (e.g. DET002) inside a `# shellcheck disable=`
    directive is NOT honoured - shellcheck cannot parse a non-SC code there
    and aborts checking the rest of the file, so bashrs must not honour it
    either. bashrs reports it (BASHRS001) naming the working `# bashrs
    disable-line=`/`disable-file=` form (GH-265)
  prediction: lint result contains DET002 and a BASHRS001 diagnostic naming
    the bashrs directive form when the only suppression present is `#
    shellcheck disable=DET002`
  test: cargo test -p bashrs --lib linter::suppression::tests_gh265::test_PMAT255_gh265_shellcheck_directive_does_not_honour_bashrs_code
  if_fails: 'Contract violation: bashrs honours its own codes inside a #
    shellcheck directive, silently disabling shellcheck for the rest of the
    file (GH-265)'
- id: F-DET002-GH265-SHELLCHECK-NAMESPACE-REJECTEDb
  rule: A mixed `# shellcheck disable=SC2086,DET002` directive still
    suppresses the real shellcheck code (SC2086) while not honouring the
    bashrs-native code (DET002) (GH-265)
  prediction: lint result does NOT contain SC2086 but DOES still contain
    DET002 when the directive is `# shellcheck disable=SC2086,DET002`
  test: cargo test -p bashrs --lib linter::suppression::tests_gh265::test_PMAT255_gh265_mixed_shellcheck_directive_splits_codes
  if_fails: 'Contract violation: a mixed shellcheck directive either stops
    suppressing SC2086 or wrongly honours the bashrs-native code (GH-265)'
- id: F-DET002-GH265-DISABLE-LINE-PLACEMENT-REPORTEDa
  rule: '`# bashrs disable-line=DET002` written on a comment-only line (the
    line ABOVE the code, not the same line) suppresses nothing - placement
    semantics are unchanged - and must be reported instead of silently
    ignored, the same failure mode as #240 (GH-265)'
  prediction: lint result contains DET002 AND a BASHRS001 diagnostic naming
    `disable-line` when the directive sits alone on the line above
  test: cargo test -p bashrs --lib linter::suppression::tests_gh265::test_PMAT255_gh265_disable_line_on_preceding_line_is_reported
  if_fails: 'Contract violation: a disable-line directive on the wrong line
    silently does nothing and nothing says why (GH-265)'
- id: F-DET002-GH265-DISABLE-LINE-PLACEMENT-REPORTEDb
  rule: A same-line `# bashrs disable-line=DET002` keeps suppressing and must
    NOT be reported as inert - the GH-265 fix only targets the wrong-line
    placement, not the working form (GH-265)
  prediction: lint result does NOT contain DET002 and does NOT contain
    BASHRS001 when `# bashrs disable-line=DET002` sits on the same line as
    the code
  test: cargo test -p bashrs --lib linter::suppression::tests_gh265::test_PMAT255_gh265_disable_line_same_line_unaffected
  if_fails: 'Contract violation: a working same-line disable-line directive
    stops suppressing, or gets wrongly reported as inert (GH-265)'
- id: F-DET002-GH265-DISABLE-LINE-PLACEMENT-REPORTEDc
  rule: '`# bashrs disable-file=DET002` is unaffected by the GH-265
    disable-line placement fix and keeps suppressing for the whole file
    (GH-265)'
  prediction: lint result does NOT contain DET002 when `# bashrs
    disable-file=DET002` is present
  test: cargo test -p bashrs --lib linter::suppression::tests_gh265::test_PMAT255_gh265_disable_file_unaffected
  if_fails: 'Contract violation: the GH-265 disable-line fix regresses
    disable-file suppression (GH-265)'
- id: F-DET003-SOUND
  rule: DET003 detects unordered glob in for-loop
  prediction: lint result contains DET003
  test: 'Given input, verify: lint result contains DET003'
  if_fails: 'Contract violation: DET003 detects unordered glob in for-loop'
- id: F-DET003-PRECISE
  rule: DET003 does NOT flag sorted glob
  prediction: lint result does NOT contain DET003
  test: 'Given input, verify: lint result does NOT contain DET003'
  if_fails: 'Contract violation: DET003 does NOT flag sorted glob'
- id: F-DET004-SOUND
  rule: DET004 detects command substitution with system-state com...
  prediction: lint result contains DET004
  test: 'Given input, verify: lint result contains DET004'
  if_fails: 'Contract violation: DET004 detects command substitution with system-state com...'
- id: F-DET004-PRECISE
  rule: DET004 does NOT flag static command
  prediction: lint result does NOT contain DET004
  test: 'Given input, verify: lint result does NOT contain DET004'
  if_fails: 'Contract violation: DET004 does NOT flag static command'
- id: F-IDEM001-SOUND
  rule: IDEM001 detects mkdir without -p
  prediction: lint result contains IDEM001
  test: 'Given input, verify: lint result contains IDEM001'
  if_fails: 'Contract violation: IDEM001 detects mkdir without -p'
- id: F-IDEM001-PRECISE
  rule: IDEM001 does NOT flag mkdir -p
  prediction: lint result does NOT contain IDEM001
  test: 'Given input, verify: lint result does NOT contain IDEM001'
  if_fails: 'Contract violation: IDEM001 does NOT flag mkdir -p'
- id: F-IDEM002-SOUND
  rule: IDEM002 detects rm without -f
  prediction: lint result contains IDEM002
  test: 'Given input, verify: lint result contains IDEM002'
  if_fails: 'Contract violation: IDEM002 detects rm without -f'
- id: F-IDEM002-PRECISE
  rule: IDEM002 does NOT flag rm -f
  prediction: lint result does NOT contain IDEM002
  test: 'Given input, verify: lint result does NOT contain IDEM002'
  if_fails: 'Contract violation: IDEM002 does NOT flag rm -f'
- id: F-IDEM003-SOUND
  rule: IDEM003 detects ln -s without force
  prediction: lint result contains IDEM003
  test: 'Given input, verify: lint result contains IDEM003'
  if_fails: 'Contract violation: IDEM003 detects ln -s without force'
- id: F-IDEM003-PRECISE
  rule: IDEM003 does NOT flag ln -sf
  prediction: lint result does NOT contain IDEM003
  test: 'Given input, verify: lint result does NOT contain IDEM003'
  if_fails: 'Contract violation: IDEM003 does NOT flag ln -sf'
kani_harnesses:
- id: KANI-LINTER_DET_IDEM-001
  obligation: DET rules detect all non-deterministic constructs
  property: DET rules detect all non-deterministic constructs
  bound: 4
  strategy: stub_float
  harness: verify_linter_det_idem_invariant
- id: KANI-LINTER_DET_IDEM-002
  obligation: DET rules do NOT false-positive on deterministic code
  property: DET rules do NOT false-positive on deterministic code
  bound: 4
  strategy: stub_float
  harness: verify_det_idem_no_false_positives
- id: KANI-LINTER_DET_IDEM-003
  obligation: DET rules detect all non-deterministic constructs ($RANDOM, timestamps, system state)
  property: DET rules detect all non-deterministic constructs ($RANDOM, timestamps, system state)
  bound: 4
  strategy: stub_float
- id: KANI-LINTER_DET_IDEM-004
  obligation: IDEM rules detect non-idempotent operations (mkdir without -p, rm without -f)
  property: IDEM rules detect non-idempotent operations (mkdir without -p, rm without -f)
  bound: 4
  strategy: stub_float
- id: KANI-LINTER_DET_IDEM-005
  obligation: IDEM rules do NOT false-positive on idempotent operations
  property: IDEM rules do NOT false-positive on idempotent operations
  bound: 4
  strategy: stub_float
