- id: PMAT-256
  github_issue: null
  item_type: task
  title: 'corpus runner sandbox: every entry runs in a temporary cwd, HOME and PATH, and under bwrap where Linux has it'
  status: planned
  priority: high
  assigned_to: noahgift
  created: 2026-09-11T08:30:00Z
  updated: 2026-09-11T08:30:00Z
  spec: null
  acceptance_criteria:
  - 'bashrs corpus run executes no entry with the callers cwd, HOME or PATH. Each Bash entry runs in a fresh temporary directory, with HOME set to it and PATH reduced to the interpreters the runner needs, on every platform. Falsifier: an entry whose transpiled output writes to the home directory leaves the callers home untouched.'
  - 'On Linux, when bwrap is present, the run is additionally wrapped in bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --bind TMP TMP --chdir TMP --unshare-net --die-with-parent. When bwrap is absent the run still happens under the temporary cwd, HOME and PATH, and says so once.'
  - 'The full corpus scores identically inside and outside the sandbox, so the sandbox is not silently failing entries, and .quality/last-corpus-run.json is still written to the callers directory.'
  phases: []
  subtasks: []
  estimated_effort: null
  labels:
  - kind:code
  - release:v7.2.0
  notes: 'Decided by quorum (2026-09-11, 2-1): the runner sandboxes itself and generation-time screening stays. Measured during the v7.1.0 cycle: 7 of 240 agent-generated candidate entries ran real commands, among them make builds, uv and agy, when executed with the callers environment. The dissenting lane warned that contributors without bwrap must still be able to run the corpus, which is why the cross-platform half of the decision is the temporary cwd, HOME and PATH. Record: docs/audits/quorum-decisions-v7.2.0.md'
