# Nightly binary builds for 5 targets
# The generator (infra machines/clean-room/deploy-workflows.sh) was deleted by
# infra PMAT-166, so this file is maintained here.
# Spec: docs/specifications/release-system.md
#
# Schedule: daily 4am UTC. Manual trigger via workflow_dispatch.
# Skips build if no commits in the last 24 hours.
#
# Produces: bashrs-{target}.tar.gz (linux/mac) or .zip (windows)
# Published as GitHub prerelease under the "nightly" tag.

name: Nightly

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Check for recent activity ────────────────────────────
  check-activity:
    runs-on: ubuntu-latest
    outputs:
      has_commits: ${{ steps.check.outputs.has_commits }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for commits in last 24h
        id: check
        run: |
          RECENT=$(git log --oneline --since="24 hours ago" | wc -l)
          if [ "$RECENT" -gt 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_commits=true" >> "$GITHUB_OUTPUT"
            echo "Found $RECENT commit(s) in last 24h (or manual trigger)"
          else
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
            echo "No commits in last 24h — skipping nightly build"
          fi

  # ── Build binaries (5 targets) ───────────────────────────
  build:
    needs: check-activity
    if: needs.check-activity.outputs.has_commits == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # THE LINUX GLIBC FLOOR IS DECLARED HERE, NOT INHERITED FROM THE RUNNER.
          #
          # These legs were `cargo build` on `ubuntu-latest`. That image is 24.04,
          # so the nightly asset needed GLIBC_2.39 and did not run on lambda-labs
          # (Ubuntu 22.04, glibc 2.35). Measured 2026-09-24 by fleet-bins
          # (infra#1055): `version GLIBC_2.39 not found` (#380). There was also no
          # aarch64-linux leg, so gx10 never got a nightly at all (#385).
          #
          # Both Linux legs now build inside rust:1.93.0-bullseye (glibc 2.31, the
          # toolchain rust-toolchain.toml pins). The floor then moves only when
          # this file changes, not when GitHub rolls an image. The two steps after
          # the build check the ARTIFACT, not the image name: its highest GLIBC_
          # symbol, and a real `--version` run inside ubuntu:22.04.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm  # native ARM64, free for public repos
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout provable-contracts (path dep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: paiml/provable-contracts
          path: provable-contracts

      - name: Symlink provable-contracts for Cargo path deps
        if: runner.os != 'Windows'
        run: ln -sf "$GITHUB_WORKSPACE/provable-contracts" "$GITHUB_WORKSPACE/../provable-contracts"

      - name: Symlink provable-contracts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\..\provable-contracts" -Target "$env:GITHUB_WORKSPACE\provable-contracts" -Force

      - name: Install Rust toolchain (macOS / Windows)
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure target is installed (macOS / Windows)
        if: runner.os != 'Linux'
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary (macOS / Windows)
        if: runner.os != 'Linux'
        run: cargo build --release -p bashrs --target ${{ matrix.target }}

      # The parent directory is mounted at its own path, so the
      # ../provable-contracts symlink resolves inside the container too.
      - name: Build release binary (Linux, inside rust:1.93.0-bullseye, glibc 2.31)
        if: runner.os == 'Linux'
        run: |
          set -eu
          T="${{ matrix.target }}"
          P=$(dirname "$GITHUB_WORKSPACE")
          docker run --rm \
            -v "$P:$P" -w "$GITHUB_WORKSPACE" \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -e CARGO_HOME=/tmp/cargo \
            -e T="$T" \
            rust:1.93.0-bullseye \
            sh -c 'set -e; ldd --version | head -n 1; cargo build --release -p bashrs --target "$T"'

      # FLEET_GLIBC_MAX is the OLDEST glibc a fleet host runs (lambda-labs and
      # intel: Ubuntu 22.04, 2.35). Raise it only when that host is upgraded,
      # never to turn a red build green.
      - name: Glibc floor (the artifact's highest GLIBC_ symbol)
        if: runner.os == 'Linux'
        env:
          FLEET_GLIBC_MAX: "2.35"
        run: |
          set -eu
          BIN="target/${{ matrix.target }}/release/bashrs"
          need=$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sed 's/GLIBC_//' | sort -uV | tail -n 1)
          [ -n "$need" ] || { echo "::error::no GLIBC_ symbol read from $BIN; refusing to guess"; exit 1; }
          echo "bashrs needs glibc $need; the fleet floor is $FLEET_GLIBC_MAX"
          top=$(printf '%s\n%s\n' "$need" "$FLEET_GLIBC_MAX" | sort -V | tail -n 1)
          [ "$top" = "$FLEET_GLIBC_MAX" ] || { echo "::error::glibc floor $need is above the fleet's $FLEET_GLIBC_MAX"; exit 1; }

      - name: The artifact runs on the fleet's oldest userland (ubuntu:22.04)
        if: runner.os == 'Linux'
        run: |
          set -eu
          docker run --rm -v "$PWD/target/${{ matrix.target }}/release:/b:ro" ubuntu:22.04 /b/bashrs --version

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          ARCHIVE="bashrs-${{ matrix.target }}"
          mkdir -p "$ARCHIVE"
          cp "target/${{ matrix.target }}/release/bashrs" "$ARCHIVE/"
          for f in README.md LICENSE LICENSE-MIT COPYING UNLICENSE; do
            [ -f "$f" ] && cp "$f" "$ARCHIVE/"
          done
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          echo "Packaged: ${ARCHIVE}.tar.gz ($(du -h "${ARCHIVE}.tar.gz" | cut -f1))"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "bashrs-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $archive
          Copy-Item "target/${{ matrix.target }}/release/bashrs.exe" "$archive/"
          foreach ($f in @("README.md", "LICENSE", "LICENSE-MIT", "COPYING", "UNLICENSE")) {
            if (Test-Path $f) { Copy-Item $f "$archive/" }
          }
          Compress-Archive -Path "$archive/*" -DestinationPath "$archive.zip"
          $hash = (Get-FileHash "$archive.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive.zip" | Out-File -Encoding ascii "$archive.zip.sha256"
          Write-Host "Packaged: $archive.zip"

      - name: Upload artifact (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bashrs-${{ matrix.target }}
          path: |
            bashrs-${{ matrix.target }}.tar.gz
            bashrs-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bashrs-${{ matrix.target }}
          path: |
            bashrs-${{ matrix.target }}.zip
            bashrs-${{ matrix.target }}.zip.sha256

  # ── Create/update nightly prerelease ─────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete existing nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

      - name: Create nightly release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          make_latest: false
          body: |
            Automated nightly build from `main`.

            **Date:** ${{ github.event.repository.updated_at || github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}

            > This is a prerelease. For stable releases, see the latest tagged version.
          files: |
            artifacts/*
