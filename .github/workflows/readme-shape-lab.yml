# readme-shape-lab — LAB check for the pv-readme SHACL shape on README.md (#512, C324).
#
# LAB, not GATE: it runs at night on main, never inside a PR, merge-queue or release job, and
# nothing `needs:` it. A red opens or updates one ticket with one owner (#512). pv-readme is not
# yet on every runner; an absent verifier is a red night here, never a skip and never a red PR.
# Promotion to the PR gate needs three green nights on main, an operator yes, and a gate named
# for retirement (C324 item 7).
name: readme-shape-lab

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-shape-lab
  cancel-in-progress: false

jobs:
  readme-shape-lab:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, clean-room]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: pv-readme must be present
        run: |
          command -v pv-readme >/dev/null || {
            echo "::error::pv-readme is not installed — README.md is unvalidated tonight (red LAB night, not a skip)"
            exit 1
          }
          pv-readme --version

      - name: README.md conforms to its readme:Readme shape
        run: pv-readme --check

      - name: A planted bad README must be refused
        run: sh tests/readme-shape-falsifier.sh
