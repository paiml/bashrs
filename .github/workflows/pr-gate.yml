# PR Authorization Gate — block PRs from unauthorized contributors
# Calls reusable workflow from paiml/.github
name: PR Gate

on:
  pull_request:
    types: [opened, reopened]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authorize:
    # Fork PRs never run privileged steps (paiml accepts no fork contributions).
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    uses: paiml/.github/.github/workflows/pr-gate.yml@fbee3788a0ed92d09974ac21ea9bc97d373af6f0

  no-pull-request-target:
    # P0 guard: a workflow that reintroduces the pull_request_target trigger fails here.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gate-light]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: guard and its fixture test
        run: sh scripts/guards/test-no-pull-request-target-guard.sh && sh scripts/guards/no-pull-request-target-guard.sh
