# Sovereign CI — calls reusable workflow from paiml/.github
# Change once in paiml/.github → applies to all repos
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 3 * * *'   # FLOW-010 F2: nightly gate on main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # RS-01: a new push cancels the superseded PR run only; main/merge-queue/schedule runs are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # RS-09: a draft PR does not start the heavy jobs (ready_for_review starts them).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: paiml/.github/.github/workflows/sovereign-ci.yml@fbee3788a0ed92d09974ac21ea9bc97d373af6f0
    with:
      repo: ${{ github.event.repository.name }}
      # Phase 3 pilot (medium workload) — build-performance.md §7 Phase 3.
      # Workspace with rash + runtime + wasm — moderate dep graph,
      # candidate for mid-range hit-rate signal between copia and aprender.
      enable_sccache: true
      use_nextest: true
      # GH-214: without this the reusable workflow runs `--lib`, which scopes to
      # the ROOT package (bashrs-specs) and never builds rash/, bashrs-oracle,
      # bashrs-runtime or bashrs-wasm. bashrs-oracle's test module therefore
      # failed to compile for months while every check stayed green. `--workspace
      # --lib` is what makes a rotting workspace member loud.
      #
      # Verified locally before enabling, because turning this on blind would red
      # the whole pipeline: `cargo test --workspace --lib --no-run` builds all 5
      # members with 0 errors (bashrs, bashrs_oracle, bashrs_runtime,
      # bashrs_specs, bashrs_wasm).
      test_workspace: true
      # rash/src/testing/shellcheck_validation_tests.rs shells out to shellcheck
      # and `.expect()`s it, so those 23 tests PANIC where it is absent. They
      # never ran before because `--lib` scoped to the root stub package; turning
      # test_workspace on is what surfaced them.
      #
      # Installed rather than skipped: that module asserts a stated critical
      # invariant — "every generated script must pass `shellcheck -s sh`" — so
      # skipping it in CI would swap a red for a silent green, which is the exact
      # failure mode this repo keeps getting bitten by. infra's clean-room gate
      # already installs shellcheck for bashrs for the same reason.
      extra_pkgs: shellcheck
      # #233 (PMAT-263): the default `--all-targets` has the same root-package
      # scoping as the pre-GH-214 test step — a bare `cargo clippy` at this
      # workspace root resolves to the `bashrs-specs` stub, so rash/,
      # bashrs-oracle, bashrs-runtime and bashrs-wasm were never linted by the
      # gate. `--workspace` is the fix, and `--all-targets` keeps tests, benches
      # and examples in scope. Measured clean locally before enabling:
      # `cargo clippy --workspace --all-targets --all-features -- -D warnings`
      # exits 0 on this tree (it needed 6 fixes in the diff that adds this
      # line: two `include!` placed after a test module, one orphan test
      # fragment in bashrs-wasm, 90 dead `let config` bindings, one snake-case
      # test name, one doc-list indent).
      #
      # Note the reusable workflow's fallback: if this command fails it retries
      # `cargo clippy -p bashrs`, which passes with a narrower scope. Keep this
      # tree clean under the full command so that fallback never decides the
      # gate; `make release-gate` runs the same full command locally.
      clippy_args: --workspace --all-targets
    secrets: inherit

  # Top-level gate: org ruleset requires status check named "gate" (exact match).
  # The reusable workflow produces "ci / gate" which doesn't satisfy the ruleset.
  gate:
    runs-on: [self-hosted, gate-light]
    needs: [ci]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Check required jobs
        env:
          CI_RESULT: ${{ needs.ci.result }}
          IS_DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          # A draft PR skips ci (RS-09); that is not a failure and cannot merge anyway.
          if [ "$CI_RESULT" = skipped ] && [ "$IS_DRAFT" = true ]; then
            echo "draft PR: ci skipped"; exit 0
          fi
          if [ "$CI_RESULT" != "success" ]; then
            echo "ci failed: $CI_RESULT"
            exit 1
          fi
          echo "All required jobs passed"

  # P0 guard: a workflow that reintroduces the pull_request_target trigger fails here.
  # It lives in CI, not PR Gate, so it runs on every push to an open PR (synchronize)
  # and on every push to main; PR Gate fires on opened/reopened only (PR #491).
  no-pull-request-target:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gate-light]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: guard and its fixture test
        run: sh scripts/guards/test-no-pull-request-target-guard.sh && sh scripts/guards/no-pull-request-target-guard.sh

  # Runner smells (paiml/infra#3828): ratchet against .github/runner-smells.baseline.
  runner-smells:
    uses: paiml/.github/.github/workflows/runner-smells.yml@d768b8ac5abfa7d0038470fd38023a15323ac0aa
    with:
      scanner_ref: d768b8ac5abfa7d0038470fd38023a15323ac0aa
