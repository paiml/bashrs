name: Binary Release

# Attaches prebuilt `bashrs` binaries to a GitHub Release as tar.gz +
# sha256. Decoupled from `cargo publish` and from the existing self-hosted
# clean-room `release.yml` — downstream consumers can `curl` the prebuilt
# binary instead of `cargo install bashrs --locked` (which compiles from
# source and is slow on cold caches).
#
# Triggered by:
#   - `release: published` — fires automatically when a release is published
#     by a person or a PAT. It does NOT fire for a release created with the
#     default GITHUB_TOKEN (GitHub does not start workflows from events that
#     token causes), which is how `release.yml` creates it.
#   - `workflow_call` — `release.yml` calls this workflow after it has
#     ensured the release exists, so a tagged release always gets binaries.
#   - `workflow_dispatch` — manual re-run / backfill, takes a tag input
#
# Targets: 4 Linux (x86_64/aarch64 × musl/gnu). musl variants are static
# and ideal for Docker / scratch / Alpine; gnu variants are smaller and
# match typical Linux distributions.
#
# Every target builds NATIVELY on a runner of its own architecture. The
# aarch64 targets used `cross` on an X64 runner until v7.4.2, where run
# 43209826709 failed in the aarch64-unknown-linux-gnu job with
# `error[E0463]: can't find crate for std` inside the `cross` container
# (the runner is itself a container; the previous green run of this
# workflow was 2026-08-21). A native build needs no second container, no
# `cross` download and no cross image pull.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (e.g. v6.65.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (e.g. v6.65.0)'
        required: true
        type: string

permissions:
  contents: write  # upload assets to the release

concurrency:
  group: binary-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: [self-hosted, clean-room, "${{ matrix.arch }}"]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: X64
          - target: x86_64-unknown-linux-gnu
            arch: X64
          - target: aarch64-unknown-linux-musl
            arch: ARM64
          - target: aarch64-unknown-linux-gnu
            arch: ARM64
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved (release event missing tag_name and no dispatch input)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building bashrs for $TAG → ${{ matrix.target }}"

      - name: Checkout at tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # bashrs's only reference to provable-contracts is a [dev-dependencies]
      # entry resolved from crates.io (not a path dep on a sibling clone).
      # Earlier revisions of this workflow checked out paiml/provable-contracts
      # to `$GITHUB_WORKSPACE/../provable-contracts/` because Cargo.toml had a
      # `path = ".."` override. That layout broke aarch64-cross builds:
      # `cross` mounts only the workspace dir into its Docker container, so a
      # sibling-of-workspace path is unreachable inside the cross image. The
      # crates.io 0.3.x release matches the archived sibling's last published
      # version semantically, so the override was redundant — we now resolve
      # purely from crates.io.

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The workspace pins a specific channel in `rust-toolchain.toml`
      # which overrides the dtolnay action for any cargo invocation in
      # the tree. Add the target explicitly to that pinned toolchain so a
      # musl build doesn't fail with `can't find crate for core` mid-build.
      - name: Install target on workspace-pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: binary-${{ matrix.target }}

      - name: Build bashrs
        run: |
          # The workspace's default-run package is `bashrs-specs`, not
          # `bashrs`. The `bashrs` binary lives in the `rash/` package
          # (also named `bashrs`); -p selects it explicitly so cargo
          # doesn't error with "no bin target named `bashrs` in
          # default-run packages".
          cargo build --release -p bashrs --bin bashrs --target ${{ matrix.target }} --locked

      - name: Strip binary
        run: |
          TARGET="${{ matrix.target }}"
          BIN_PATH="target/${TARGET}/release/bashrs"
          # Native build: the runner's own `strip` matches the target.
          strip "$BIN_PATH"
          # Refuse to package a binary of the wrong architecture: read the
          # ELF e_machine field (offset 18, little-endian) rather than
          # depend on `file` being installed in the runner image.
          case "$TARGET" in
            x86_64-*)  WANT=3e00 ;;
            aarch64-*) WANT=b700 ;;
            *) echo "::error::no e_machine value known for $TARGET"; exit 1 ;;
          esac
          GOT=$(od -An -tx1 -j18 -N2 "$BIN_PATH" | tr -d ' \n')
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::$BIN_PATH has ELF e_machine $GOT, want $WANT for $TARGET"
            exit 1
          fi
          ls -la "$BIN_PATH"

      - name: Package archive
        id: package
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="bashrs-${VERSION}-${TARGET}"
          mkdir -p "$ARCHIVE"
          cp "target/${TARGET}/release/bashrs" "$ARCHIVE/"
          for f in README.md LICENSE LICENSE-MIT LICENSE-APACHE; do
            [ -f "$f" ] && cp "$f" "$ARCHIVE/"
          done
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          echo "archive=${ARCHIVE}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha=${ARCHIVE}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          du -h "${ARCHIVE}.tar.gz"

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.sha }}" \
            --clobber

  summary:
    name: Summary
    needs: build
    runs-on: [self-hosted, clean-room, X64]
    timeout-minutes: 10
    if: always()
    steps:
      - name: Write summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          STATUS="${{ needs.build.result }}"
          {
            echo "### Binary Release: $TAG"
            echo ""
            if [ "$STATUS" = "success" ]; then
              echo "- Build matrix: **4/4 targets succeeded**"
            else
              echo "- Build matrix: **partial** (status=$STATUS)"
            fi
            echo "- Targets:"
            echo "  - x86_64-unknown-linux-musl"
            echo "  - x86_64-unknown-linux-gnu"
            echo "  - aarch64-unknown-linux-musl"
            echo "  - aarch64-unknown-linux-gnu"
          } >> "$GITHUB_STEP_SUMMARY"
