[package]
name = "bashrs-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM bindings for bashrs shell safety linter (SSC v11 Phase 5)"
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bashrs = { version = "7.0.1", path = "../rash", default-features = false, features = ["minimal"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = { version = "0.8", optional = true }

[features]
default = []
# CodeBERT WASM classifier (requires WASM-002/004)
codebert = ["safetensors"]
# PRB-006 Docker cross-browser matrix. A declared, empty feature: it gates the placeholder
# in tests/probar_shell_safety.rs, so `--all-features` builds it and the tests still need Docker.
docker = []

[dev-dependencies]
wasm-bindgen-test = "0.3"

[[test]]
name = "probar_shell_safety"
path = "tests/probar_shell_safety.rs"
